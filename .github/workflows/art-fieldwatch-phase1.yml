name: ART Fieldwatch phase 1
on:
  pull_request:
    paths: ['art-fieldwatch-phase1/**', '.github/workflows/art-fieldwatch-phase1.yml']
  workflow_dispatch:
    inputs:
      arm64:
        description: 'Run experimental arm64 JIT hook test'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node --check art-fieldwatch-phase1/jit-boundary-probe.js
      - run: python3 -m py_compile art-fieldwatch-phase1/ci/smoke_test.py
      - run: bash -n art-fieldwatch-phase1/ci/run-emulator-smoke.sh
      - run: bash -n art-fieldwatch-phase1/ci/dex-inventory.sh
      - run: bash -n art-fieldwatch-phase1/ci/build-passive-shim.sh
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 33
            variant: debug
          - api: 33
            variant: release
          - api: 34
            variant: debug
    env:
      FRIDA_VERSION: '17.27.1'
      ARTWATCH_BUILD_VARIANT: ${{ matrix.variant }}
      ARTWATCH_LOG_DIR: /tmp/artwatch-logs
      ARTWATCH_REQUIRE_JIT: '1'
      ARTWATCH_SHADOW_SHIM: ${{ matrix.api == 33 && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      # Emulator 37.3+ refuses -accel off without an explicit TCG override.
      # GitHub-hosted Ubuntu runners support KVM once the device is accessible.
      - name: Enable and verify KVM before installing the emulator
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -c /dev/kvm ]; then
            echo "::error::No /dev/kvm device: cannot boot accelerated x86_64 emulator on this runner."
            exit 1
          fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
            sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          if [ ! -r /dev/kvm ] || [ ! -w /dev/kvm ]; then
            echo "::error::/dev/kvm is not readable/writable by the runner."
            exit 1
          fi
          echo "KVM device is accessible"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build API33 passive shadow shim
        if: matrix.api == 33
        run: bash art-fieldwatch-phase1/ci/build-passive-shim.sh
      - name: Build selected APK variant
        shell: bash
        run: |
          case "$ARTWATCH_BUILD_VARIANT" in
            debug) task=assembleDebug ;;
            release) task=assembleRelease ;;
            *) exit 1 ;;
          esac
          gradle -p art-fieldwatch-phase1/test ":app:$task" --no-daemon
      - name: Verify packaged native shadow library
        if: matrix.api == 33
        run: |
          apk="art-fieldwatch-phase1/test/app/build/outputs/apk/$ARTWATCH_BUILD_VARIANT/app-$ARTWATCH_BUILD_VARIANT.apk"
          unzip -l "$apk" | grep 'lib/x86_64/libartwatch_shadow.so'
      - name: Record compiled fixture DEX for D8 comparison
        run: bash art-fieldwatch-phase1/ci/dex-inventory.sh
      - run: python3 -m pip install 'frida==17.27.1'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: default
          arch: x86_64
          profile: pixel_2
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          script: bash art-fieldwatch-phase1/ci/run-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwatch-api${{ matrix.api }}-x86_64-${{ matrix.variant }}
          path: /tmp/artwatch-logs/
          if-no-files-found: ignore
  android-arm64:
    if: github.event_name == 'workflow_dispatch' && inputs.arm64
    runs-on: macos-15
    timeout-minutes: 45
    env:
      FRIDA_VERSION: '17.27.1'
      ARTWATCH_LOG_DIR: /tmp/artwatch-logs
      ARTWATCH_REQUIRE_JIT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle -p art-fieldwatch-phase1/test :app:assembleDebug --no-daemon
      - run: python3 -m pip install 'frida==17.27.1'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          script: bash art-fieldwatch-phase1/ci/run-emulator-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artwatch-api34-arm64
          path: /tmp/artwatch-logs/
          if-no-files-found: ignore
